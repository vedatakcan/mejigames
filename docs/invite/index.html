<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meji</title>

<!-- iPhone / iPad için otomatik yönlendirme -->
<meta http-equiv="refresh"
      content="1.5;url=https://apps.apple.com/app/id6752789849">

<style>

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
}

body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0e35;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.progress-container {
    width: 200px;
    height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: linear-gradient(90deg, #3498db, #2ecc71);
    animation: loadBar 1.2s ease forwards;
}

@keyframes loadBar {
    from {
        width: 0%;
    }

    to {
        width: 100%;
    }
}

</style>

</head>

<body>

<div class="progress-container">
    <div class="progress-bar"></div>
</div>

<script>

const ua = navigator.userAgent || navigator.vendor || window.opera;

const isAndroid = /Android/i.test(ua);
const isIOS = /iPhone|iPad|iPod/i.test(ua);

const iosStore =
    "https://apps.apple.com/app/id6752789849";

const androidStore =
    "https://play.google.com/store/apps/details?id=com.vedatakcan.meji";

if (isAndroid) {

    document.querySelector('meta[http-equiv="refresh"]')
        .setAttribute(
            "content",
            "1.5;url=" + androidStore
        );

    setTimeout(function() {
        window.location.href = androidStore;
    }, 1500);

}

else if (isIOS) {

    setTimeout(function() {
        window.location.href = iosStore;
    }, 1500);

}

else {

    setTimeout(function() {
        window.location.href = iosStore;
    }, 1500);

}

</script>

</body>
</html>
