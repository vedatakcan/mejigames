<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meji</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0d0e35;
        }

        .progress-container {
            width: 200px;
            height: 6px;
            background: rgba(255,255,255,0.15);
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #3498db, #2ecc71);
            animation: loadBar 1.2s ease forwards;
        }

        @keyframes loadBar {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="progress-container">
    <div class="progress-bar"></div>
</div>

<script>

    const iosStore = "https://apps.apple.com/app/id6752789849";
    const androidStore = "https://play.google.com/store/apps/details?id=com.vedatakcan.meji";
    const fallback = "https://vedatakcan.github.io/mejigames/";

    const ua = navigator.userAgent || navigator.vendor || window.opera;

    let targetUrl = fallback;

    if (/iPhone|iPad|iPod/i.test(ua)) {
        targetUrl = iosStore;
    } 
    else if (/Android/i.test(ua)) {
        targetUrl = androidStore;
    }

    console.log("Device:", ua);
    console.log("Redirecting to:", targetUrl);

    setTimeout(() => {
        window.location.href = targetUrl;
    }, 1200);

</script>

</body>
</html>
