<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meji</title>

  <!-- Global Sosyal Medya Önizleme Ayarları -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Meji" />
  <meta property="og:url" content="https://vedatakcan.github.io/mejigames/invite/" />
  
  <!-- Yeni eklediğin meji.png logosu -->
  <meta property="og:image" content="https://vedatakcan.github.io/mejigames/meji.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="512" />
  <meta property="og:image:height" content="512" />

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Meji">
  <meta name="twitter:image" content="https://vedatakcan.github.io/mejigames/meji.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #0d0e35; /* Meji Kurumsal Koyu Mavi */
      color: white;
    }

    /* Progress Container */
    .progress-container {
      width: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    /* Dolma Animasyonlu Progress Bar */
    .progress-bar {
      width: 0%;
      height: 6px;
      background: linear-gradient(90deg, #3498db, #2ecc71); /* Koyu maviden yeşile şık geçiş */
      border-radius: 10px;
      animation: loadBar 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes loadBar {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

<!-- Ekranda sadece bu progress bar görünecek, sıfır yazı! -->
<div class="progress-container">
  <div class="progress-bar"></div>
</div>

<script>
  // Cihaz ve Mağaza Yönlendirme Mantığı
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  const iosStore = "https://apps.apple.com/app/id6752789849";
  const androidStore = "https://play.google.com/store/apps/details?id=com.vedatakcan.meji";
  const fallbackUrl = "https://vedatakcan.github.io/mejigames/";

  let targetUrl = fallbackUrl;

  if (isIOS) {
    targetUrl = iosStore;
  } else if (isAndroid) {
    targetUrl = androidStore;
  }

  // Kullanıcı bar animasyonunu (veya geçişi) çok kısa görebilsin diye anlık bir tetikleme
  setTimeout(function() {
    window.location.replace(targetUrl);
  }, 100); 
</script>

</body>
</html>
